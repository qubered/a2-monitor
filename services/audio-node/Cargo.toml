[package]
name = "a2-audio-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
a2-audio-core = { path = "../../crates/audio-core" }
a2-audio-host-api = { path = "../../crates/audio-host-api" }
a2-build-info = { path = "../../crates/build-info" }
a2-ipc = { path = "../../crates/ipc" }
a2-media = { path = "../../crates/media" }
a2-pcm-abi = { path = "../../crates/pcm-abi" }
a2-replay = { path = "../../crates/replay" }
a2-supervisor = { path = "../../crates/supervisor" }
opus = "0.4.0"
serde_json = "1.0.151"
socket2 = "0.6.5"
# AWS-LC is ADR 0017's named fallback provider; the Apple provider needs a Swift toolchain and a
# macOS 15 deployment target. See ADR 0026.
str0m = { version = "0.23.1", default-features = false, features = ["aws-lc-rs"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.15.3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "a2-synthetic-capture"
path = "src/bin/synthetic-capture.rs"

[[bin]]
name = "a2-replay-smoke"
path = "src/bin/replay-smoke.rs"

[[bin]]
name = "a2-media-worker-smoke"
path = "src/bin/media-worker-smoke.rs"

[[bin]]
name = "pulse-device-capture"
path = "src/bin/device-capture.rs"

[[bin]]
name = "pulse-media-worker"
path = "src/bin/pulse-media-worker/main.rs"

[[bin]]
name = "pulse-device-output"
path = "src/bin/device-output.rs"
