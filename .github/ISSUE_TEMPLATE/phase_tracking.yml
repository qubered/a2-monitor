name: Phase tracking
description: Track one roadmap phase or independently gated phase slice.
title: "[Phase]: "
labels: [roadmap, tracking]
body:
  - type: markdown
    attributes:
      value: |
        Use this as the phase execution ledger. Link the durable repository documents instead of copying decisions that can drift. A checked box must be backed by committed code or named evidence.
  - type: input
    id: roadmap_phase
    attributes:
      label: Roadmap phase
      description: Exact phase or slice name, such as 0B-M or 1A.2.
      placeholder: 0B-M
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the capability or uncertainty this phase must resolve.
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites and dependencies
      description: Link preceding phase issues, ADRs, architecture, quality gates, hardware access and external decisions.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Deliverables
      description: Use a checklist. Keep hardware, application, contract, security and documentation work explicit.
      placeholder: "- [ ] Deliverable with a link to its governing document"
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Explicitly out of scope
      description: Name attractive adjacent work that must not enter this phase.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence and exit gate
      description: Name the exact tests, measurements, platforms, hardware and operator evidence required. Separate targets from verified results.
    validations:
      required: true
  - type: textarea
    id: progress
    attributes:
      label: Current progress
      description: Link branches and pull requests. Record completed work, decisions, blockers and the next safe task with UTC dates.
      placeholder: "YYYY-MM-DD: Not started. Next: ..."
    validations:
      required: true
  - type: checkboxes
    id: discipline
    attributes:
      label: Tracking discipline
      options:
        - label: Repository documents remain the durable source of truth; discrepancies will be reconciled in the same change.
          required: true
        - label: Hardware, performance, security and operator gates will not be closed from CI or implementation alone.
          required: true
