name: Repository checks

# Runs on every pull request and push to main on one Linux runner, the
# cheapest hosted runner. The Windows and macOS portability jobs cost 2x and
# 10x per minute and live in portability.yml, run by hand.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels its superseded run.
concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check repository baseline
        run: ./scripts/check-repo.sh
      - name: Install application dependencies
        run: npm ci
      - name: Check application workspaces
        run: npm run check
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Require a clean tracked checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
